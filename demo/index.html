<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Sudoku</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="assets/css/styles.css?v=8" rel="stylesheet">
    </head>
    <body>
        <button
            id="toggle-header"
            class="header-toggle"
            type="button"
            aria-controls="game-header"
            aria-expanded="true"
        >Hide header</button>

        <main class="game-shell">
            <header id="game-header" class="game-header">
                <div>
                    <p class="eyebrow">Very hard collection</p>
                    <h1>Sudoku</h1>
                </div>
                <div class="puzzle-count" aria-live="polite">
                    <span>Puzzle</span>
                    <strong id="puzzle-number">Loading...</strong>
                </div>
            </header>

            <section class="game-area" aria-label="Sudoku game">
                <div id="sudoku-board" class="sudoku-board" role="grid" aria-label="Sudoku board"></div>

                <div class="game-controls">
                    <p id="status" class="status" aria-live="polite">Loading puzzle...</p>
                    <div class="button-row">
                        <button id="previous" type="button">Previous</button>
                        <button id="reset" type="button">Reset</button>
                        <button id="next" class="primary" type="button">Next puzzle</button>
                    </div>
                </div>
            </section>

            <div id="load-error" class="load-error" role="alert" hidden>
                Could not load puzzle.txt. Start this page through a local web server.
            </div>
        </main>

        <script src="assets/js/app.js?v=5"></script>
    </body>
</html>
